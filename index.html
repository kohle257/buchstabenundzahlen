<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buchstaben Lernen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.95; }
    }
    .active-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-ring 1.3s infinite ease-in-out;
    }
    .badge-shadow {
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.25));
    }
  </style>
</head>
<body class="bg-sky-50 h-screen w-screen flex flex-col justify-between items-center p-3 sm:p-4 overflow-hidden select-none font-sans">

  <!-- Kopfbereich -->
  <header class="w-full max-w-xl flex justify-between items-center z-20">
    <button id="speakBtn" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-white font-bold px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 text-xl transition-transform" title="Vorlesen">
      🔊 <span id="letterLabel" class="text-2xl font-extrabold flex items-center gap-1">L 🪜</span>
    </button>

    <div class="flex-1 mx-3 bg-white/90 p-2 rounded-2xl shadow border border-sky-100 flex flex-col gap-1">
      <div class="flex justify-between text-xs font-bold text-sky-800 px-1">
        <span>Strich <span id="currentStrokeNum">1</span> / <span id="totalStrokesNum">2</span></span>
        <span id="percentLabel">0%</span>
      </div>
      <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
      </div>
    </div>

    <div class="flex gap-2">
      <button id="clearBtn" class="bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-bold px-4 py-3 rounded-2xl shadow-lg text-lg transition-transform" title="Neu malen">
        🗑
      </button>
      <button id="nextBtn" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-5 py-3 rounded-2xl shadow-lg text-lg transition-transform" title="Nächster Buchstabe">
        ➡️
      </button>
    </div>
  </header>

  <!-- Zeichenfläche -->
  <main class="relative flex-1 w-full max-w-xl my-2 bg-white rounded-3xl shadow-2xl border-4 border-sky-200 overflow-hidden flex items-center justify-center">
    
    <svg id="letterSvg" class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 400 500">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
        </marker>
        <marker id="arrow-inactive" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#cbd5e1" />
        </marker>
      </defs>
      <!-- Leitlinien -->
      <g id="guideLayer"></g>
      <!-- Start- und Ziel-Markierungen -->
      <g id="targetLayer"></g>
      <!-- Ziffern & Badges -->
      <g id="badgeLayer"></g>
    </svg>

    <canvas id="paintCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>

    <!-- Erfolgs-Banner -->
    <div id="successBanner" class="hidden absolute z-30 inset-0 bg-emerald-500/25 backdrop-blur-sm flex flex-col items-center justify-center">
      <span class="text-7xl animate-bounce">⭐</span>
      <h2 class="text-3xl font-black text-emerald-800 mt-2">Klasse gemacht!</h2>
    </div>
  </main>

  <!-- Farbauswahl -->
  <footer class="w-full max-w-xl flex justify-center items-center gap-3 py-1 z-20">
    <div class="flex gap-4 bg-white/90 backdrop-blur px-4 py-2 rounded-2xl shadow-lg border border-sky-100">
      <button class="color-pick w-11 h-11 rounded-full bg-rose-500 ring-4 ring-rose-200 scale-110 shadow transition" data-color="#f43f5e"></button>
      <button class="color-pick w-11 h-11 rounded-full bg-amber-500 shadow transition" data-color="#f59e0b"></button>
      <button class="color-pick w-11 h-11 rounded-full bg-emerald-500 shadow transition" data-color="#10b981"></button>
      <button class="color-pick w-11 h-11 rounded-full bg-sky-500 shadow transition" data-color="#0ea5e9"></button>
      <button class="color-pick w-11 h-11 rounded-full bg-purple-500 shadow transition" data-color="#a855f7"></button>
    </div>
  </footer>

    let currentLetter = null;
    let currentColor = '#f43f5e';
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    // Stroke-Tracking
    let strokeData = [];
    let currentStrokeIndex = 0;
    let completed = false;
    let hasUserInteracted = false;

    // Großzügige Toleranz für Kinderhände
    const ZONE_RADIUS = 46;

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const guideLayer = document.getElementById('guideLayer');
    const targetLayer = document.getElementById('targetLayer');
    const badgeLayer = document.getElementById('badgeLayer');
    const letterLabel = document.getElementById('letterLabel');
    const currentStrokeNum = document.getElementById('currentStrokeNum');
    const totalStrokesNum = document.getElementById('totalStrokesNum');
    const progressBar = document.getElementById('progressBar');
    const percentLabel = document.getElementById('percentLabel');
    const successBanner = document.getElementById('successBanner');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.12);
        osc.stop(audioCtx.currentTime + i * 0.12 + 0.4);
      });
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function calculateBadgePositions(strokes) {
      const positions = [];
      const threshold = 35;

      strokes.forEach((stroke, i) => {
        let [x, y] = stroke.start;
        let overlapCount = 0;
        for (let j = 0; j < i; j++) {
          const prev = positions[j];
          if (Math.hypot(prev.origX - x, prev.origY - y) < threshold) {
            overlapCount++;
          }
        }

        let displayX = x;
        let displayY = y;
        if (overlapCount > 0) {
          displayX += overlapCount * 38;
          displayY -= (overlapCount % 2 === 0 ? 8 : -8);
        }

        positions.push({ origX: x, origY: y, displayX, displayY });
      });

      return positions;
    }

    function loadLetter(letter) {
      currentLetter = letter;
      letterLabel.textContent = `${letter.char} ${letter.icon || ''}`;
      currentStrokeIndex = 0;
      completed = false;

      successBanner.classList.add('hidden');
      clearCanvas();

      totalStrokesNum.textContent = letter.strokes.length;

      guideLayer.innerHTML = '';
      targetLayer.innerHTML = '';
      badgeLayer.innerHTML = '';
      strokeData = [];

      const badgePositions = calculateBadgePositions(letter.strokes);
      const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

      letter.strokes.forEach((stroke, idx) => {
        // Führungspfad
        const guide = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        guide.setAttribute('d', stroke.d);
        guide.setAttribute('fill', 'none');
        guide.setAttribute('stroke', '#f1f5f9');
        guide.setAttribute('stroke-width', '48');
        guide.setAttribute('stroke-linecap', 'round');
        guideLayer.appendChild(guide);

        // Richtungspfeil
        const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        arrow.setAttribute('d', stroke.d);
        arrow.setAttribute('fill', 'none');
        arrow.setAttribute('stroke', idx === 0 ? '#0284c7' : '#cbd5e1');
        arrow.setAttribute('stroke-width', '5');
        arrow.setAttribute('stroke-dasharray', '10 10');
        arrow.setAttribute('marker-end', idx === 0 ? 'url(#arrow)' : 'url(#arrow-inactive)');
        arrow.setAttribute('id', `arrow-${idx}`);
        guideLayer.appendChild(arrow);

        // Pfad vermessen & Start-/Endkoordinaten ermitteln
        const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('d', stroke.d);
        tempSvg.appendChild(pathEl);
        const len = pathEl.getTotalLength();
        const startPt = pathEl.getPointAtLength(0);
        const endPt = pathEl.getPointAtLength(len);

        // Checkpoints für Mindest-Verbindung (nur 6-8 Stützpunkte)
        const pts = [];
        const steps = 7;
        for (let i = 0; i <= steps; i++) {
          const pt = pathEl.getPointAtLength((i / steps) * len);
          pts.push({ x: pt.x, y: pt.y, hit: false });
        }

        strokeData.push({
          start: { x: startPt.x, y: startPt.y, touched: false },
          end: { x: endPt.x, y: endPt.y, touched: false },
          checkpoints: pts,
          finished: false
        });

        // Visuelle ZIEL-Markierung (Zielfahne / roter Zielkreis)
        const targetGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        targetGroup.setAttribute('id', `target-${idx}`);
        targetGroup.setAttribute('class', idx === 0 ? 'badge-shadow' : 'hidden');

        const targetCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        targetCircle.setAttribute('cx', endPt.x);
        targetCircle.setAttribute('cy', endPt.y);
        targetCircle.setAttribute('r', '18');
        targetCircle.setAttribute('fill', '#f43f5e');
        targetCircle.setAttribute('stroke', '#ffffff');
        targetCircle.setAttribute('stroke-width', '2');

        const flagText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        flagText.setAttribute('x', endPt.x);
        flagText.setAttribute('y', endPt.y + 6);
        flagText.setAttribute('text-anchor', 'middle');
        flagText.setAttribute('font-size', '14');
        flagText.textContent = '🏁';

        targetGroup.appendChild(targetCircle);
        targetGroup.appendChild(flagText);
        targetLayer.appendChild(targetGroup);

        // Visuelle START-Markierung (Grüner Ziffern-Badge)
        const pos = badgePositions[idx];
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'badge-shadow');
        g.setAttribute('id', `badge-group-${idx}`);

        if (pos.origX !== pos.displayX || pos.origY !== pos.displayY) {
          const connector = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          connector.setAttribute('x1', pos.origX);
          connector.setAttribute('y1', pos.origY);
          connector.setAttribute('x2', pos.displayX);
          connector.setAttribute('y2', pos.displayY);
          connector.setAttribute('stroke', '#94a3b8');
          connector.setAttribute('stroke-width', '2');
          connector.setAttribute('stroke-dasharray', '3 3');
          g.appendChild(connector);
        }

        const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pulse.setAttribute('cx', pos.displayX);
        pulse.setAttribute('cy', pos.displayY);
        pulse.setAttribute('r', '22');
        pulse.setAttribute('fill', '#4ade80');
        pulse.setAttribute('class', idx === 0 ? 'active-pulse' : 'hidden');
        pulse.setAttribute('id', `pulse-${idx}`);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.displayX);
        circle.setAttribute('cy', pos.displayY);
        circle.setAttribute('r', '17');
        circle.setAttribute('fill', idx === 0 ? '#16a34a' : '#94a3b8');
        circle.setAttribute('id', `circle-${idx}`);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.displayX);
        text.setAttribute('y', pos.displayY + 6);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '16');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('fill', '#ffffff');
        text.textContent = (idx + 1).toString();

        g.appendChild(pulse);
        g.appendChild(circle);
        g.appendChild(text);
        badgeLayer.appendChild(g);
      });

      updateStepUI();
      speak(letter.word || letter.char);
    }

    function updateStepUI() {
      currentStrokeNum.textContent = Math.min(currentStrokeIndex + 1, currentLetter ? currentLetter.strokes.length : 1);
      
      const finishedCount = strokeData.filter(s => s.finished).length;
      const pct = strokeData.length > 0 ? Math.round((finishedCount / strokeData.length) * 100) : 0;
      progressBar.style.width = `${pct}%`;
      percentLabel.textContent = `${pct}%`;

      if (currentLetter) {
        currentLetter.strokes.forEach((_, idx) => {
          const pulse = document.getElementById(`pulse-${idx}`);
          const circle = document.getElementById(`circle-${idx}`);
          const arrow = document.getElementById(`arrow-${idx}`);
          const target = document.getElementById(`target-${idx}`);
          if (!pulse || !circle || !arrow || !target) return;

          if (idx === currentStrokeIndex) {
            pulse.classList.remove('hidden');
            circle.setAttribute('fill', '#16a34a');
            arrow.setAttribute('stroke', '#0284c7');
            arrow.setAttribute('marker-end', 'url(#arrow)');
            target.classList.remove('hidden');
          } else if (idx < currentStrokeIndex) {
            pulse.classList.add('hidden');
            circle.setAttribute('fill', '#10b981');
            target.classList.add('hidden'); // erledigtes Ziel ausblenden
          } else {
            pulse.classList.add('hidden');
            circle.setAttribute('fill', '#94a3b8');
            arrow.setAttribute('stroke', '#e2e8f0');
            arrow.setAttribute('marker-end', 'url(#arrow-inactive)');
            target.classList.add('hidden');
          }
        });
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const drawX = clientX - rect.left;
      const drawY = clientY - rect.top;
      const svgX = (drawX / rect.width) * 400;
      const svgY = (drawY / rect.height) * 500;
      return { drawX, drawY, svgX, svgY };
    }

    function startDraw(e) {
      if (!hasUserInteracted) {
        hasUserInteracted = true;
        if (currentLetter) speak(currentLetter.word || currentLetter.char);
      }

      if (completed) return;
      isDrawing = true;
      const pos = getCanvasCoordinates(e);
      lastX = pos.drawX;
      lastY = pos.drawY;
      trackProgress(pos.svgX, pos.svgY);
    }

    function draw(e) {
      if (!isDrawing || completed) return;
      e.preventDefault();
      const pos = getCanvasCoordinates(e);

      // Pinselzug
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.drawX, pos.drawY);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 32;
      ctx.stroke();

      lastX = pos.drawX;
      lastY = pos.drawY;

      trackProgress(pos.svgX, pos.svgY);
    }

    function stopDraw() {
      isDrawing = false;
    }

    // Kernlogik: Wurden Start und Zielbereich des Strichs sauber verbunden?
    function trackProgress(x, y) {
      if (completed || !strokeData[currentStrokeIndex]) return;

      const current = strokeData[currentStrokeIndex];

      // 1. Startzone registrieren
      if (!current.start.touched) {
        if (Math.hypot(current.start.x - x, current.start.y - y) <= ZONE_RADIUS) {
          current.start.touched = true;
        }
      }

      // 2. Wegpunkte dazwischen registrieren
      current.checkpoints.forEach(pt => {
        if (Math.hypot(pt.x - x, pt.y - y) <= ZONE_RADIUS) {
          pt.hit = true;
        }
      });

      // 3. Zielzone registrieren
      const distToEnd = Math.hypot(current.end.x - x, current.end.y - y);
      if (distToEnd <= ZONE_RADIUS) {
        current.end.touched = true;
      }

      // 4. Verbindungsprüfung: Start berührt + Ziel berührt + mind. 55% des Pfads gestreift
      const hitPoints = current.checkpoints.filter(p => p.hit).length;
      const middleCoverage = hitPoints / current.checkpoints.length;

      if (current.start.touched && current.end.touched && middleCoverage >= 0.55) {
        current.finished = true;

        if (currentStrokeIndex < currentLetter.strokes.length - 1) {
          // Direkt und nahtlos zum Folgestrich wechseln (ohne Absetzen!)
          currentStrokeIndex++;
          updateStepUI();

          // Neuen Strich sofort mit der aktuellen Fingerposition prüfen (wichtig für Bogen 1 -> Bogen 2)
          if (strokeData[currentStrokeIndex]) {
            const next = strokeData[currentStrokeIndex];
            if (Math.hypot(next.start.x - x, next.start.y - y) <= ZONE_RADIUS) {
              next.start.touched = true;
            }
          }
        } else {
          // Alle Striche erfolgreich verbunden!
          completed = true;
          updateStepUI();
          triggerSuccess();
        }
      }
    }

    function triggerSuccess() {
      successBanner.classList.remove('hidden');
      playSound();

      if (window.confetti) {
        confetti({
          particleCount: 90,
          spread: 85,
          origin: { y: 0.6 }
        });
      }

      speak("Super gemacht!");

      setTimeout(() => {
        loadLetter(getRandomLetter());
      }, 2500);
    }

    function getRandomLetter() {
      const candidates = LETTERS.filter(l => !currentLetter || l.char !== currentLetter.char);
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function clearCanvas() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (strokeData[currentStrokeIndex]) {
        strokeData[currentStrokeIndex].start.touched = false;
        strokeData[currentStrokeIndex].end.touched = false;
        strokeData[currentStrokeIndex].checkpoints.forEach(p => p.hit = false);
      }
      updateStepUI();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'de-DE';
        utter.rate = 0.82;
        utter.pitch = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    // Touch & Maus Listener
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDraw);

    document.getElementById('nextBtn').addEventListener('click', () => loadLetter(getRandomLetter()));
    document.getElementById('clearBtn').addEventListener('click', clearCanvas);
    document.getElementById('speakBtn').addEventListener('click', () => {
      if (currentLetter) speak(currentLetter.word || currentLetter.char);
    });

    document.querySelectorAll('.color-pick').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-pick').forEach(b => {
          b.classList.remove('ring-4', 'ring-rose-200', 'scale-110');
        });
        currentColor = e.currentTarget.dataset.color;
        e.currentTarget.classList.add('ring-4', 'ring-rose-200', 'scale-110');
      });
    });

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('load', () => {
      resizeCanvas();
      loadLetter(LETTERS[0]); // Startet mit L wie Leiter
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
    });
  </script>
</body>
</html>
