<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buchstaben Lernen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Pulsierender Startpunkt */
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 0.5; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    .pulse-dot {
      transform-origin: center;
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-sky-50 h-screen w-screen flex flex-col justify-between items-center p-4 overflow-hidden select-none font-sans">

  <!-- Kopfbereich mit Steuerungs-Buttons -->
  <header class="w-full max-w-xl flex justify-between items-center z-20">
    <button id="speakBtn" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-white font-bold p-4 rounded-2xl shadow-lg flex items-center gap-2 text-xl transition-transform">
      🔊 <span id="letterLabel" class="text-2xl">A</span>
    </button>
    <div class="flex gap-2">
      <button id="clearBtn" class="bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-bold px-5 py-3 rounded-2xl shadow-lg text-lg transition-transform">
        🗑️ Neu malen
      </button>
      <button id="nextBtn" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-6 py-3 rounded-2xl shadow-lg text-lg transition-transform">
        ➡️ Nächster
      </button>
    </div>
  </header>

  <!-- Haupt-Zeichenbereich -->
  <main class="relative flex-1 w-full max-w-xl my-3 bg-white rounded-3xl shadow-xl border-4 border-sky-200 overflow-hidden flex items-center justify-center">
    
    <!-- SVG Führungslinien (Buchstabe, Pfeile, Punkte) -->
    <svg id="letterSvg" class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 400 500">
      <defs>
        <!-- Pfeilspitze für Linien -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
        </marker>
      </defs>
      <!-- Wird dynamisch befüllt -->
      <g id="letterPaths"></g>
    </svg>

    <!-- Canvas zum Freihand-Nachspuren -->
    <canvas id="paintCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>
  </main>

  <!-- Farbauswahl für den Pinsel -->
  <footer class="w-full max-w-xl flex justify-center items-center gap-4 py-2 z-20">
    <div class="flex gap-3 bg-white/80 backdrop-blur p-2 rounded-2xl shadow border border-sky-100">
      <button class="color-pick w-10 h-10 rounded-full bg-rose-500 ring-4 ring-rose-200 scale-110" data-color="#f43f5e"></button>
      <button class="color-pick w-10 h-10 rounded-full bg-amber-500" data-color="#f59e0b"></button>
      <button class="color-pick w-10 h-10 rounded-full bg-emerald-500" data-color="#10b981"></button>
      <button class="color-pick w-10 h-10 rounded-full bg-sky-500" data-color="#0ea5e9"></button>
      <button class="color-pick w-10 h-10 rounded-full bg-purple-500" data-color="#a855f7"></button>
    </div>
  </footer>

  <script>
    // Definition von Buchstaben mit Strichen (d = SVG-Pfad, start = Startpunkt-Koordinaten)
    const LETTERS = [
      {
        char: 'A',
        strokes: [
          { d: 'M 200 80 L 100 420', start: [200, 80] },
          { d: 'M 200 80 L 300 420', start: [200, 80] },
          { d: 'M 140 280 L 260 280', start: [140, 280] }
        ]
      },
      {
        char: 'B',
        strokes: [
          { d: 'M 130 80 L 130 420', start: [130, 80] },
          { d: 'M 130 80 C 260 80, 260 250, 130 250', start: [130, 80] },
          { d: 'M 130 250 C 270 250, 270 420, 130 420', start: [130, 250] }
        ]
      },
      {
        char: 'C',
        strokes: [
          { d: 'M 290 140 C 130 80, 90 350, 290 380', start: [290, 140] }
        ]
      },
      {
        char: 'D',
        strokes: [
          { d: 'M 140 80 L 140 420', start: [140, 80] },
          { d: 'M 140 80 C 310 80, 310 420, 140 420', start: [140, 80] }
        ]
      },
      {
        char: 'E',
        strokes: [
          { d: 'M 150 80 L 150 420', start: [150, 80] },
          { d: 'M 150 80 L 280 80', start: [150, 80] },
          { d: 'M 150 250 L 250 250', start: [150, 250] },
          { d: 'M 150 420 L 280 420', start: [150, 420] }
        ]
      },
      {
        char: 'O',
        strokes: [
          { d: 'M 200 80 C 100 80, 100 420, 200 420 C 300 420, 300 80, 200 80', start: [200, 80] }
        ]
      },
      {
        char: 'L',
        strokes: [
          { d: 'M 150 80 L 150 420', start: [150, 80] },
          { d: 'M 150 420 L 280 420', start: [150, 420] }
        ]
      }
    ];

    let currentLetter = null;
    let currentColor = '#f43f5e';
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const svgGroup = document.getElementById('letterPaths');
    const letterLabel = document.getElementById('letterLabel');

    // Canvas auflösen
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    // Buchstabe rendern
    function loadLetter(letter) {
      currentLetter = letter;
      letterLabel.textContent = letter.char;
      clearCanvas();

      // SVG leeren und neu aufbauen
      svgGroup.innerHTML = '';

      letter.strokes.forEach((stroke, idx) => {
        // 1. Hintergrund-Leitspur (grau-blau gepunktet)
        const guide = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        guide.setAttribute('d', stroke.d);
        guide.setAttribute('fill', 'none');
        guide.setAttribute('stroke', '#cbd5e1');
        guide.setAttribute('stroke-width', '44');
        guide.setAttribute('stroke-linecap', 'round');
        svgGroup.appendChild(guide);

        // 2. Richtungslinie mit Pfeil
        const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        arrowPath.setAttribute('d', stroke.d);
        arrowPath.setAttribute('fill', 'none');
        arrowPath.setAttribute('stroke', '#0284c7');
        arrowPath.setAttribute('stroke-width', '6');
        arrowPath.setAttribute('stroke-dasharray', '12 10');
        arrowPath.setAttribute('marker-end', 'url(#arrow)');
        svgGroup.appendChild(arrowPath);

        // 3. Startpunkt mit Ziffer
        const [x, y] = stroke.start;
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');

        const pulseCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pulseCircle.setAttribute('cx', x);
        pulseCircle.setAttribute('cy', y);
        pulseCircle.setAttribute('r', '20');
        pulseCircle.setAttribute('fill', '#4ade80');
        pulseCircle.setAttribute('class', 'pulse-dot');

        const startCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        startCircle.setAttribute('cx', x);
        startCircle.setAttribute('cy', y);
        startCircle.setAttribute('r', '15');
        startCircle.setAttribute('fill', '#16a34a');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y + 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '14');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('fill', '#ffffff');
        text.textContent = (idx + 1).toString();

        group.appendChild(pulseCircle);
        group.appendChild(startCircle);
        group.appendChild(text);
        svgGroup.appendChild(group);
      });

      speakLetter(letter.char);
    }

    function getRandomLetter() {
      const candidates = LETTERS.filter(l => !currentLetter || l.char !== currentLetter.char);
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function clearCanvas() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
    }

    function speakLetter(char) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(char);
        utter.lang = 'de-DE';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    // Zeichen-Events
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDraw(e) {
      isDrawing = true;
      const pos = getPointerPos(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPointerPos(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 28;
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
    }

    function stopDraw() {
      isDrawing = false;
    }

    // Touch & Maus Listener
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDraw);

    // Event Handler Buttons
    document.getElementById('nextBtn').addEventListener('click', () => loadLetter(getRandomLetter()));
    document.getElementById('clearBtn').addEventListener('click', clearCanvas);
    document.getElementById('speakBtn').addEventListener('click', () => currentLetter && speakLetter(currentLetter.char));

    // Farbauswahl
    document.querySelectorAll('.color-pick').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-pick').forEach(b => {
          b.classList.remove('ring-4', 'ring-rose-200', 'scale-110');
        });
        currentColor = e.currentTarget.dataset.color;
        e.currentTarget.classList.add('ring-4', 'ring-rose-200', 'scale-110');
      });
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // Initialisierung & Service Worker
    window.addEventListener('load', () => {
      resizeCanvas();
      loadLetter(getRandomLetter());

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
    });
  </script>
</body>
</html>
